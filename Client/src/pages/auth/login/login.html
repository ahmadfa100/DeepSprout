<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5fff7">
  <meta name="description" content="Log in to your DeepSprout account and continue growing at your own pace.">
  <title>Log in — DeepSprout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="../../../../src/styles/theme.css">
  <link rel="stylesheet" href="../../../../src/layouts/site-layout/site-layout.css">
  <script src="../../../../src/layouts/site-layout/site-layout.js" defer></script>
  <script src="login.js" defer></script>
</head>
<body data-page="login" data-root="../../../../">
  <main class="auth-scene" id="main">
    <div class="auth-glow" aria-hidden="true"></div>
    <span class="floating-leaf leaf-one" aria-hidden="true"></span>
    <span class="floating-leaf leaf-two" aria-hidden="true"></span>
    <section class="login-card" aria-labelledby="login-title">
      <a class="login-brand" href="../../../../index.html" aria-label="DeepSprout home">
        <img src="../../../../assets/auth/deepsprout-floral-mark.png" alt="" width="70" height="70">
        <span>DeepSprout</span>
      </a>
      <h1 id="login-title">Welcome back!</h1>
      <form id="login-form" novalidate>
        <div class="form-field">
          <label for="email">Email</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="m3.5 6 8.5 6.4L20.5 6"/></svg>
            <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" inputmode="email" required aria-describedby="email-error">
          </div>
          <p class="field-error" id="email-error" aria-live="polite"></p>
        </div>
        <div class="form-field password-field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="12" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/><circle cx="12" cy="16" r="1"/></svg>
            <input id="password" name="password" type="password" placeholder="Your password" autocomplete="current-password" required aria-describedby="password-error">
            <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" aria-controls="password">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.3 12S6 6 12 6s9.7 6 9.7 6S18 18 12 18s-9.7-6-9.7-6Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="field-error" id="password-error" aria-live="polite"></p>
        </div>
        <button class="forgot-link" type="button" data-auth-action="forgot">Forgot password?</button>
        <button class="login-submit" type="submit">Log in <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-7-6 7 6-7 6"/></svg></button>
      </form>
      <div class="login-divider"><span>or continue with</span></div>
      <div class="social-options" aria-label="Other sign-in options">
        <button type="button" data-auth-action="Google"><span class="google-g" aria-hidden="true">G</span>Google</button>
        <button type="button" data-auth-action="Apple"><svg class="apple-mark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.6 12.6c0-2.1 1.7-3.1 1.8-3.2-.9-1.4-2.3-1.6-2.8-1.6-1.2-.1-2.2.7-2.8.7-.7 0-1.6-.7-2.7-.7-1.4 0-2.7.8-3.4 2-.9 1.5-.7 4.3.7 6.5.7 1.1 1.6 2.4 2.8 2.3 1.1 0 1.5-.7 2.8-.7s1.7.7 2.8.7c1.2 0 2-1.1 2.7-2.2.8-1.2 1.1-2.4 1.1-2.5-.1 0-3-1.1-3-3.3ZM15.7 6.3c.6-.7 1-1.7.9-2.7-.9 0-1.9.6-2.5 1.3-.6.7-1 1.6-.9 2.5.9.1 1.8-.4 2.5-1.1Z"/></svg>Apple</button>
        <button type="button" data-auth-action="Facebook"><span class="facebook-mark" aria-hidden="true">f</span>Facebook</button>
      </div>
      <p class="signup-line">Don't have an account? <a href="../../../../register.html">Sign up</a></p>
    </section>
  </main>
  <div data-site-footer></div>
  <div class="auth-toast" id="auth-toast" role="status" aria-live="polite" hidden></div>
  <dialog class="auth-dialog" id="auth-dialog" aria-labelledby="dialog-title">
    <button class="dialog-close" type="button" aria-label="Close dialog">×</button>
    <img src="../../../../assets/auth/deepsprout-floral-mark.png" alt="" width="56" height="56">
    <h2 id="dialog-title"></h2>
    <p id="dialog-message"></p>
    <button class="dialog-done" type="button">Got it</button>
  </dialog>
</body>
</html>
