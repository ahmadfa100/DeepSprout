<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="../../../../assets/brand/logo.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfbf6">
  <meta name="description" content="Your Personal Garden: four practice trees grown only from real records.">
  <title>My Garden — DeepSprout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../../src/styles/style.css">
  <link rel="stylesheet" href="../../../../src/layouts/member-layout/member-layout.css">
  <link rel="stylesheet" href="garden.css">
  
  <script type="module" src="../../../../src/shared/member-bridge.js"></script>
  <script src="../../../js/data/personal-access.js" defer></script>
  <script src="../../../../src/js/data/account.js" defer></script>
  <script src="../../../../src/layouts/member-layout/member-layout.js" defer></script>
  <script src="garden.js" defer></script>
</head>
<body data-page="garden" data-root="../../../../">
  <div data-site-header></div>

  <main class="garden-page">
    <!-- 1 · Heading -->
    <header class="garden-head">
      <p class="garden-eyebrow">Garden</p>
      <h1>My Garden</h1>
      <p id="garden-subtitle">Four small trees, grown only from what you actually did. Nothing here is a score.</p>
    </header>

    <!-- 2 · The scene -->
    <section class="garden-scene" aria-label="Your garden">
      <canvas id="garden-canvas" role="img" aria-label="Your garden is loading"></canvas>
      <!-- One transparent button over each tree: focusable, with a tooltip on hover, focus or tap. -->
      <div class="garden-trees" id="garden-trees" role="group" aria-label="Trees in your garden" hidden></div>
      <div class="garden-tip" id="garden-tip" aria-hidden="true" hidden></div>
      <button type="button" class="garden-replay" id="garden-replay" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v4.5h4.5"/></svg>Replay entrance
      </button>
    </section>
    <p class="garden-hint" id="garden-hint"></p>

    <!-- 3 · Growth by practice: one summary card per practice type -->
    <section class="garden-kinds" id="garden-next" aria-label="Growth by practice"></section>

    <!-- 4 · Recently grown -->
    <article class="garden-achievement" id="garden-achievement" aria-labelledby="achievement-title"></article>
  </main>

  <div data-site-footer></div>
</body>
</html>
