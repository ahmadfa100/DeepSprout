 <dialog id="focus-dialog" aria-labelledby="check-title"><form method="dialog"><button class="dialog-close" aria-label="Close focus check">×</button></form><h2 id="check-title">Let's find your starting point.</h2><p>How often does scrolling interrupt something you meant to do?</p><div class="check-options"><button data-result="You've already noticed the pattern. Try one 25-minute focus session today.">Sometimes <span>→</span></button><button data-result="A short focus session can help you reclaim one moment at a time. Start with 10 minutes.">Most days <span>→</span></button><button data-result="Start gently: put your phone aside for five minutes and focus on one small task.">Many times a day <span>→</span></button></div><p id="check-result" aria-live="polite"></p></dialog>
