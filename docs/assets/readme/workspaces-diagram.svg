<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 710" width="1200" height="710">
<title id="title">DeepSprout workspaces</title><desc id="desc">Individual, Coach, Student, Institution, Supervisor and Outdoor Provider share platform records under Admin governance.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#168557"/></marker></defs>
<rect width="1200" height="710" rx="30" fill="#fffaf1"/>
<text x="48" y="65" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="34" font-weight="700">Connected workspaces</text><text x="48" y="100" fill="#60746a" font-family="DM Sans,Arial,sans-serif" font-size="20" font-weight="500">One person&#x27;s journey can connect to programs, initiatives and experiences.</text><rect x="45" y="145" width="350" height="142" rx="22" fill="#fffefa" stroke="#d8e6d7" stroke-width="2"/><text x="68" y="201" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="27" font-weight="700">Individual</text><text x="68" y="238" fill="#60746a" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="500">Personal journey</text><rect x="425" y="145" width="350" height="142" rx="22" fill="#fffefa" stroke="#d8e6d7" stroke-width="2"/><text x="448" y="201" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="27" font-weight="700">Coach</text><text x="448" y="238" fill="#60746a" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="500">Programs + reviews</text><rect x="805" y="145" width="350" height="142" rx="22" fill="#fffefa" stroke="#d8e6d7" stroke-width="2"/><text x="828" y="201" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="27" font-weight="700">Invited Student</text><text x="828" y="238" fill="#60746a" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="500">Group tasks</text><rect x="45" y="325" width="350" height="142" rx="22" fill="#fffefa" stroke="#d8e6d7" stroke-width="2"/><text x="68" y="381" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="27" font-weight="700">Institution</text><text x="68" y="418" fill="#60746a" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="500">Initiatives</text><rect x="425" y="325" width="350" height="142" rx="22" fill="#fffefa" stroke="#d8e6d7" stroke-width="2"/><text x="448" y="381" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="27" font-weight="700">Supervisor</text><text x="448" y="418" fill="#60746a" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="500">Attendance + evidence</text><rect x="805" y="325" width="350" height="142" rx="22" fill="#fffefa" stroke="#d8e6d7" stroke-width="2"/><text x="828" y="381" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="27" font-weight="700">Outdoor Provider</text><text x="828" y="418" fill="#60746a" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="500">Experiences + bookings</text><path d="M397 216 L423 216" fill="none" stroke="#168557" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M777 216 L803 216" fill="none" stroke="#168557" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M397 396 L423 396" fill="none" stroke="#168557" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M777 396 L803 396" fill="none" stroke="#168557" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="45" y="535" width="1110" height="90" rx="22" fill="#edf4e9" stroke="#d8e6d7" stroke-width="2"/><text x="69" y="577" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="25" font-weight="700">Platform Admin</text><text x="305" y="576" fill="#60746a" font-family="DM Sans,Arial,sans-serif" font-size="20" font-weight="500">approval · publishing · governance · policy · audit views</text><text x="48" y="668" fill="#168557" font-family="DM Sans,Arial,sans-serif" font-size="20" font-weight="600">Roles are scoped grants. Subscription entitlements are a separate concern.</text><path d="M220 533 L220 471" fill="none" stroke="#168557" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M600 533 L600 471" fill="none" stroke="#168557" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M980 533 L980 471" fill="none" stroke="#168557" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/></svg>