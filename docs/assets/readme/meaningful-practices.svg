<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 585" width="1200" height="585">
<title id="title">Four DeepSprout Meaningful Practices</title><desc id="desc">Depth Practice, Listening and Recall, Practical Micro-Challenge and Protected Work each have different evidence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#168557"/></marker></defs>
<rect width="1200" height="585" rx="30" fill="#fffaf1"/>
<text x="48" y="68" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="34" font-weight="700">Four Meaningful Practices</text><text x="48" y="102" fill="#60746a" font-family="DM Sans,Arial,sans-serif" font-size="20" font-weight="500">Distinct activities, evidence types and levels — selected for the person&#x27;s plan.</text><rect x="45" y="145" width="540" height="180" rx="22" fill="#fffefa" stroke="#d8e6d7" stroke-width="2"/><text x="73" y="183" fill="#168557" font-family="DM Sans,Arial,sans-serif" font-size="16" font-weight="700">01 / READ</text><text x="73" y="225" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="29" font-weight="700">Depth Practice</text><text x="73" y="261" fill="#60746a" font-family="DM Sans,Arial,sans-serif" font-size="19" font-weight="500">Passage + comprehension</text><text x="73" y="296" fill="#168557" font-family="DM Sans,Arial,sans-serif" font-size="17" font-weight="600">System-scored answers</text><rect x="615" y="145" width="540" height="180" rx="22" fill="#fffefa" stroke="#d8e6d7" stroke-width="2"/><text x="643" y="183" fill="#168557" font-family="DM Sans,Arial,sans-serif" font-size="16" font-weight="700">02 / LISTEN</text><text x="643" y="225" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="29" font-weight="700">Listening &amp; Recall</text><text x="643" y="261" fill="#60746a" font-family="DM Sans,Arial,sans-serif" font-size="19" font-weight="500">Original audio + questions</text><text x="643" y="296" fill="#168557" font-family="DM Sans,Arial,sans-serif" font-size="17" font-weight="600">Playback + scored recall</text><rect x="45" y="350" width="540" height="180" rx="22" fill="#fffefa" stroke="#d8e6d7" stroke-width="2"/><text x="73" y="388" fill="#168557" font-family="DM Sans,Arial,sans-serif" font-size="16" font-weight="700">03 / MAKE</text><text x="73" y="430" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="29" font-weight="700">Practical Micro-Challenge</text><text x="73" y="466" fill="#60746a" font-family="DM Sans,Arial,sans-serif" font-size="19" font-weight="500">Concrete prompt + outcome</text><text x="73" y="501" fill="#168557" font-family="DM Sans,Arial,sans-serif" font-size="17" font-weight="600">Self-reported artifact</text><rect x="615" y="350" width="540" height="180" rx="22" fill="#fffefa" stroke="#d8e6d7" stroke-width="2"/><text x="643" y="388" fill="#168557" font-family="DM Sans,Arial,sans-serif" font-size="16" font-weight="700">04 / DO</text><text x="643" y="430" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="29" font-weight="700">Protected Work</text><text x="643" y="466" fill="#60746a" font-family="DM Sans,Arial,sans-serif" font-size="19" font-weight="500">Intentional work session</text><text x="643" y="501" fill="#168557" font-family="DM Sans,Arial,sans-serif" font-size="17" font-weight="600">Time + self-reported result</text></svg>