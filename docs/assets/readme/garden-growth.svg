<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 600" width="1200" height="600">
<title id="title">DeepSprout Garden earned growth</title><desc id="desc">Four practice types grow four trees from qualifying evidence, while other participation can earn bounded details.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#168557"/></marker></defs>
<rect width="1200" height="600" rx="30" fill="#fffaf1"/>
<text x="48" y="66" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="34" font-weight="700">Growth has a source</text><text x="48" y="103" fill="#60746a" font-family="DM Sans,Arial,sans-serif" font-size="20" font-weight="500">The Garden reflects qualifying practice and verified participation, not time spent in the app.</text><rect x="45" y="140" width="1110" height="320" rx="28" fill="#fffefa" stroke="#d8e6d7" stroke-width="2"/><path d="M75 407 Q600 435 1125 407" fill="none" stroke="#d1dece" stroke-width="8"/><path d="M190 403 V320" stroke="#477c59" stroke-width="8" stroke-linecap="round"/><path d="M190 362 C145 350 142 312 184 329 L190 362Z" fill="#a7c99e"/><path d="M190 342 C235 332 239 295 198 315 L190 342Z" fill="#6ea676"/><text x="190" y="445" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Depth</text><path d="M460 403 V285" stroke="#477c59" stroke-width="8" stroke-linecap="round"/><path d="M460 327 C415 315 412 277 454 294 L460 327Z" fill="#a7c99e"/><path d="M460 307 C505 297 509 260 468 280 L460 307Z" fill="#6ea676"/><text x="460" y="445" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Listening</text><path d="M735 403 V307" stroke="#477c59" stroke-width="8" stroke-linecap="round"/><path d="M735 349 C690 337 687 299 729 316 L735 349Z" fill="#a7c99e"/><path d="M735 329 C780 319 784 282 743 302 L735 329Z" fill="#6ea676"/><text x="735" y="445" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Challenge</text><path d="M1000 403 V265" stroke="#477c59" stroke-width="8" stroke-linecap="round"/><path d="M1000 307 C955 295 952 257 994 274 L1000 307Z" fill="#a7c99e"/><path d="M1000 287 C1045 277 1049 240 1008 260 L1000 287Z" fill="#6ea676"/><text x="1000" y="445" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Protected Work</text><text x="48" y="523" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="22" font-weight="700">Practice tree sources</text><text x="48" y="555" fill="#60746a" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="500">Valid, eligible original attempts; one source counts once.</text><text x="650" y="523" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="22" font-weight="700">Other earned details</text><text x="650" y="555" fill="#60746a" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="500">Routine, attendance and completion follow separate rules.</text></svg>