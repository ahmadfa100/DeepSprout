<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 680" width="1200" height="680">
<title id="title">DeepSprout current and target architecture</title><desc id="desc">The browser-local website and separate database milestone compared with the planned ASP.NET Core MVC application using EF Core and SQL Server.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#168557"/></marker></defs>
<rect width="1200" height="680" rx="30" fill="#fffaf1"/>
<text x="48" y="65" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="34" font-weight="700">Architecture: present and target</text><text x="48" y="103" fill="#60746a" font-family="DM Sans,Arial,sans-serif" font-size="20" font-weight="500">The website is a browser-local demo; database validation is a separate milestone.</text><rect x="45" y="139" width="1110" height="191" rx="22" fill="#fffefa" stroke="#d8e6d7" stroke-width="2"/><text x="70" y="182" fill="#168557" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="700">CURRENT / STATIC DEMO</text><text x="70" y="230" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="25" font-weight="700">HTML + CSS + JavaScript</text><text x="415" y="230" fill="#168557" font-family="DM Sans,Arial,sans-serif" font-size="27" font-weight="700">→</text><text x="475" y="230" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="23" font-weight="600">Browser-local journals + shared records</text><text x="70" y="282" fill="#60746a" font-family="DM Sans,Arial,sans-serif" font-size="19" font-weight="500">Client/ pages and workspaces; Server/ has EF Core + SQL Server validation.</text><rect x="45" y="370" width="1110" height="266" rx="22" fill="#edf4e9" stroke="#d8e6d7" stroke-width="2"/><text x="70" y="414" fill="#168557" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="700">TARGET / PRODUCTION ARCHITECTURE</text><text x="70" y="470" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="25" font-weight="700">ASP.NET Core MVC</text><text x="365" y="470" fill="#168557" font-family="DM Sans,Arial,sans-serif" font-size="27" font-weight="700">→</text><text x="420" y="470" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="24" font-weight="700">EF Core + SQL Server</text><text x="70" y="523" fill="#60746a" font-family="DM Sans,Arial,sans-serif" font-size="19" font-weight="500">Authenticated identity · role and resource scopes · versioned transitions · audit trail</text><text x="70" y="569" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="21" font-weight="600">Optional validated browser extension</text><text x="70" y="601" fill="#60746a" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="500">MVC hosting and a database are required; GitHub Pages serves static files only.</text></svg>