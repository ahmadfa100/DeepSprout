<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 585" width="1200" height="585">
<title id="title">DeepSprout personal recovery journey</title><desc id="desc">Account creation, Bimo, setup, baselines and plan activation lead to weekly actions and review within a continuous journey.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#168557"/></marker></defs>
<rect width="1200" height="585" rx="30" fill="#fffaf1"/>
<text x="48" y="64" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="32" font-weight="700">One journey, many deliberate steps</text><text x="48" y="96" fill="#60746a" font-family="DM Sans,Arial,sans-serif" font-size="19" font-weight="500">Baseline establishes a starting point; weekly decisions shape each Recovery Cycle.</text><rect x="45" y="132" width="210" height="126" rx="22" fill="#fffefa" stroke="#d8e6d7" stroke-width="2"/><text x="69" y="164" fill="#168557" font-family="DM Sans,Arial,sans-serif" font-size="14" font-weight="700">01</text><text x="69" y="202" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="24" font-weight="700">Create account</text><text x="69" y="233" fill="#60746a" font-family="DM Sans,Arial,sans-serif" font-size="16" font-weight="500">One person identity</text><path d="M256 196 L273 196" fill="none" stroke="#168557" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="275" y="132" width="210" height="126" rx="22" fill="#fffefa" stroke="#d8e6d7" stroke-width="2"/><text x="299" y="164" fill="#168557" font-family="DM Sans,Arial,sans-serif" font-size="14" font-weight="700">02</text><text x="299" y="202" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="24" font-weight="700">Meet Bimo</text><text x="299" y="233" fill="#60746a" font-family="DM Sans,Arial,sans-serif" font-size="16" font-weight="500">Welcome and context</text><path d="M486 196 L503 196" fill="none" stroke="#168557" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="505" y="132" width="210" height="126" rx="22" fill="#fffefa" stroke="#d8e6d7" stroke-width="2"/><text x="529" y="164" fill="#168557" font-family="DM Sans,Arial,sans-serif" font-size="14" font-weight="700">03</text><text x="529" y="202" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="24" font-weight="700">Personal setup</text><text x="529" y="233" fill="#60746a" font-family="DM Sans,Arial,sans-serif" font-size="16" font-weight="500">Goal and availability</text><path d="M716 196 L733 196" fill="none" stroke="#168557" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="735" y="132" width="210" height="126" rx="22" fill="#fffefa" stroke="#d8e6d7" stroke-width="2"/><text x="759" y="164" fill="#168557" font-family="DM Sans,Arial,sans-serif" font-size="14" font-weight="700">04</text><text x="759" y="202" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="24" font-weight="700">Four baselines</text><text x="759" y="233" fill="#60746a" font-family="DM Sans,Arial,sans-serif" font-size="16" font-weight="500">Lab starting measures</text><path d="M946 196 L963 196" fill="none" stroke="#168557" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="965" y="132" width="210" height="126" rx="22" fill="#fffefa" stroke="#d8e6d7" stroke-width="2"/><text x="989" y="164" fill="#168557" font-family="DM Sans,Arial,sans-serif" font-size="14" font-weight="700">05</text><text x="989" y="202" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="24" font-weight="700">Plan preview</text><text x="989" y="233" fill="#60746a" font-family="DM Sans,Arial,sans-serif" font-size="16" font-weight="500">Review and activate</text><rect x="45" y="308" width="1110" height="179" rx="25" fill="#edf4e9" stroke="#dcead9" stroke-width="2"/><text x="72" y="354" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="27" font-weight="700">Recovery Cycle · usually 28 days</text><text x="72" y="389" fill="#168557" font-family="DM Sans,Arial,sans-serif" font-size="21" font-weight="700">Weekly actions</text><text x="307" y="389" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="21" font-weight="600">→  Review actual evidence</text><text x="615" y="389" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="21" font-weight="600">→  Accept / keep / adjust</text><text x="73" y="439" fill="#60746a" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="500">Lab rechecks have their own weekly window; Insights retain source and uncertainty.</text><text x="48" y="545" fill="#173c33" font-family="DM Sans,Arial,sans-serif" font-size="21" font-weight="600">Cycle review → next cycle, maintenance, pause or archive; history stays with the journey.</text></svg>